services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jupyter-lab-mcp
    ports:
      - "8888:8888"
    env_file:
      - .env
    volumes:
      - .:/home/work
    depends_on:
      - postgres
    restart: unless-stopped
 
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pgsql-mcp
    command: python /home/work/http_server.py
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/home/work
    depends_on:
      - postgres
    restart: unless-stopped
 
  postgres:
    image: postgres:16-alpine
    container_name: market-db
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
 
volumes:
  pgdata:
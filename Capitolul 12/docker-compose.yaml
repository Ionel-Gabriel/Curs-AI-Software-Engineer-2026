services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jupyter-lab
    ports:
      - "8888:8888"
    volumes:
      - .:/home/work
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    command: mlflow ui --host 0.0.0.0 --port 5000
    ports: 
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns